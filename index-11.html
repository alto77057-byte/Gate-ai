<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GateAi: change the photo, keep the face</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#0e0720;--ink:#f6f1ff;--mut:#a99bd0;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.06);--acc:#b79cff;--grad:linear-gradient(135deg,#7a2cf0,#e91ec0);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 10% 0%,rgba(122,44,240,.5),transparent 70%),radial-gradient(50% 40% at 100% 25%,rgba(233,30,192,.3),transparent 70%),radial-gradient(60% 40% at 50% 110%,rgba(122,44,240,.35),transparent 70%)}
.wrap{max-width:1000px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(48px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif}
header img{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 20px rgba(122,44,240,.5)}
h1{font:800 clamp(38px,9vw,66px)/1.02 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.025em;margin:38px 0 10px;max-width:15ch}
.sub{margin:0;color:var(--mut);font-size:18px}
.card{margin-top:30px;padding:22px;border:1px solid var(--line);border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;align-items:center}
.arch{position:relative;width:100%;max-width:300px;aspect-ratio:3/4;margin:0 auto;border:2px dashed rgba(255,255,255,.3);border-radius:999px 999px 22px 22px;overflow:hidden;background:linear-gradient(160deg,rgba(122,44,240,.38),rgba(233,30,192,.16));display:flex;align-items:center;justify-content:center;cursor:pointer}
.arch.has{border:2px solid rgba(255,255,255,.35);box-shadow:0 0 50px rgba(233,30,192,.3)}
.arch:focus-within{outline:3px solid var(--acc);outline-offset:3px}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arch input{position:absolute;inset:0;opacity:0;cursor:pointer}
#hint{display:grid;justify-items:center;gap:12px;font-weight:700;color:var(--ink)}
.plus{width:58px;height:58px;border-radius:50%;background:var(--grad);font-style:normal;font-size:32px;line-height:56px;text-align:center;box-shadow:0 10px 30px rgba(233,30,192,.4)}
.panel{display:grid;gap:14px}
textarea{width:100%;min-height:92px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.07);color:var(--ink);font:inherit;resize:vertical}
textarea::placeholder{color:var(--mut)}
textarea:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--grad);font-weight:700;box-shadow:0 6px 20px rgba(233,30,192,.35)}
.lockbox{display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.05)}
.row{display:flex;align-items:center;gap:10px}
.row b{margin-left:auto;font-weight:700}
.row .grow{flex:1;font-weight:700}
.ico{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--grad)}
.sw{appearance:none;-webkit-appearance:none;position:relative;width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.2);cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:linear-gradient(135deg,#7a2cf0,#e91ec0)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:#e91ec0}
.consent{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:15px}
.consent input{width:20px;height:20px;flex:none;accent-color:#e91ec0;margin:0}
.go{border:0;border-radius:18px;background:var(--grad);color:#fff;font:700 18px "Bricolage Grotesque",system-ui,sans-serif;padding:17px;cursor:pointer;box-shadow:0 14px 36px rgba(233,30,192,.38)}
.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#status{min-height:1.4em;margin:0;color:var(--mut);font-size:14px}
#out{display:none;margin-top:36px}
.pair{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
.pair figure{margin:0;flex:1 1 240px;max-width:320px}
.pair .arch{cursor:default;border-style:solid;max-width:none}
.pair figcaption{margin-top:10px;text-align:center;font-weight:700;color:var(--mut)}
.badge{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:99px;background:rgba(14,7,32,.75);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media (prefers-reduced-motion:no-preference){.go{transition:transform .12s}.go:active{transform:scale(.98)}}
</style>
</head>
<body>

<h1>Change the photo. Keep the face.</h1>
<p class="sub">Upload a photo and describe the edit.</p>

<main class="card">
<label class="arch" id="drop">
<input type="file" id="file" accept="image/*" aria-label="Upload a photo">
<span id="hint"><i class="plus">+</i>Add photo</span>
</label>

<div class="panel">
<textarea id="prompt" aria-label="Describe the edit" placeholder="Beach at sunset, white shirt"></textarea>
<div class="chips" id="chips"></div>
<div class="lockbox">
<div class="row"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="grow">Face lock</span><input type="checkbox" id="face" class="sw" checked aria-label="Face lock"></div>
<div class="row"><span>Strength</span><b id="sv">40%</b></div>
<input type="range" id="str" min="10" max="90" value="40" aria-label="Edit strength">
</div>
<label class="consent"><input type="checkbox" id="ok"><span>I have permission to edit this photo.</span></label>
<button class="go" id="go" disabled>Generate</button>
<p id="status" role="status"></p>
</div>
</main>

<section id="out" aria-live="polite">
<div class="pair">
<figure><div class="arch"><img id="before" alt="Original photo"></div><figcaption>Before</figcaption></figure>
<figure><div class="arch"><img id="after" alt="Edited photo"><span class="badge">Face locked</span></div><figcaption>After</figcaption></figure>
</div>
</section>
</div>

<script>
var STYLES = {"Original":"none","Studio":"contrast(1.1) brightness(1.05)","Warm":"sepia(.35) saturate(1.2)","Noir":"grayscale(1) contrast(1.15)","Vivid":"saturate(1.7) contrast(1.05)"};
var style = "Studio", dataUrl = "";
var $ = function(id){return document.getElementById(id)};
var chips = $("chips");
Object.keys(STYLES).forEach(function(n){
  var b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = n;
  b.setAttribute("aria-pressed", n === style);
  b.onclick = function(){
    style = n;
    Array.prototype.forEach.call(chips.children, function(c){c.setAttribute("aria-pressed", c.textContent === n)});
  };
  chips.appendChild(b);
});
function refresh(){ $("go").disabled = !(dataUrl && $("ok").checked); }
$("ok").onchange = refresh;
$("str").oninput = function(){ $("sv").textContent = this.value + "%"; };
$("file").onchange = function(){
  var f = this.files && this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var tmp = new Image();
    tmp.onload = function(){
      var s = Math.min(1, 896 / Math.max(tmp.width, tmp.height));
      var c = document.createElement("canvas");
      c.width = Math.round(tmp.width * s); c.height = Math.round(tmp.height * s);
      c.getContext("2d").drawImage(tmp, 0, 0, c.width, c.height);
      var q = 0.85;
      dataUrl = c.toDataURL("image/jpeg", q);
      while (dataUrl.length > 190000 && q > 0.4) { q -= 0.1; dataUrl = c.toDataURL("image/jpeg", q); }
      var old = $("drop").querySelector("img");
      if (old) old.remove();
      var im = document.createElement("img");
      im.alt = "Your uploaded photo"; im.src = dataUrl;
      $("drop").insertBefore(im, $("drop").firstChild);
      $("hint").style.display = "none";
      $("drop").classList.add("has");
      refresh();
    };
    tmp.src = r.result;
  };
  r.readAsDataURL(f);
};
$("go").onclick = async function(){
  var st = $("status");
  $("go").disabled = true;
  st.textContent = "Generating… up to a minute.";
  var body = {id: crypto.randomUUID().replace(/-/g, ""), image: dataUrl, prompt: $("prompt").value.trim(), style: style, strength: Number($("str").value) / 100, faceLock: $("face").checked};
  try {
    var res = await fetch("/.netlify/functions/generate-background", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (res.status !== 202) throw new Error("Could not start the job (" + res.status + ").");
    var out = null;
    for (var i = 0; i < 100 && !out; i++) {
      await new Promise(function(r){ setTimeout(r, 3000); });
      var p = await fetch("/.netlify/functions/result?id=" + body.id);
      if (!p.ok) continue;
      var d = await p.json();
      if (d.status === "error") throw new Error(d.error || "The image service failed.");
      if (d.status === "done") out = d.image;
    }
    if (!out) throw new Error("It took too long.");
    $("before").src = dataUrl;
    $("after").src = out;
    $("after").style.filter = "none";
    $("out").style.display = "block";
    $("out").scrollIntoView({behavior: "smooth"});
    st.textContent = "Done.";
  } catch (e) {
    st.textContent = "Could not generate the image. " + e.message + " Try again.";
  }
  refresh();
};
</script>
</body>
</html>
